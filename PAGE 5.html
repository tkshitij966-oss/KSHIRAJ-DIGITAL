<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { background-color: #111714; color: #FBFBF9; font-family: 'Plus Jakarta Sans', sans-serif; } .font-serif { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="bg-brand-base text-brand-cream">
    <header class="fixed top-0 left-0 right-0 z-50 bg-brand-base/85 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="font-serif text-2xl tracking-widest uppercase font-bold text-brand-cream">Kshiraj</a>
            <nav class="hidden lg:flex items-center gap-8 text-sm font-medium">
                <a href="index.html" class="hover:text-brand-sand">Home</a>
                <a href="about.html" class="hover:text-brand-sand">About Us</a>
                <a href="services.html" class="hover:text-brand-sand">Services</a>

                <a href="collaborations.html" class="hover:text-brand-sand">Collaborations</a>
            </nav>
            <a href="contact.html" class="text-brand-sand font-semibold text-xs tracking-widest uppercase">Start a Project</a>
        </div>
    </header>

    <div class="pt-36 pb-20 bg-brand-base border-b border-white/10 text-center">
        <h1 class="font-serif text-4xl sm:text-6xl text-brand-cream">Let's Build Something Unforgettable</h1>
        <p class="text-brand-muted mt-4 font-light">Get in touch via phone, WhatsApp, or email.</p>
    </div>

    <section class="py-28 max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12">
        <div class="p-8 bg-brand-surface border border-white/10 space-y-6">
            <div>
                <p class="text-xs uppercase tracking-widest text-brand-sand font-semibold mb-1">Direct Phone / WhatsApp</p>
                <a href="https://wa.me/917218795901" target="_blank" class="text-xl font-serif text-brand-cream hover:text-brand-sand">+91 72187 95901</a>
            </div>
            <div>
                <p class="text-xs uppercase tracking-widest text-brand-sand font-semibold mb-1">Official Email</p>
                <a href="mailto:kshirajproductions@gmail.com" class="text-lg font-serif text-brand-cream hover:text-brand-sand">kshirajproductions@gmail.com</a>
            </div>
        </div>
        <div class="p-8 bg-brand-surface border border-white/10">
            <form onsubmit="event.preventDefault(); alert('Inquiry submitted successfully!');" class="space-y-4">
                <div>
                    <label class="text-xs uppercase tracking-widest text-brand-cream">Your Name</label>
                    <input type="text" required class="w-full bg-brand-base border border-white/10 p-3 text-brand-cream mt-1 focus:outline-none focus:border-brand-sand">
                </div>
                <div>
                    <label class="text-xs uppercase tracking-widest text-brand-cream">Work Email</label>
                    <input type="email" required class="w-full bg-brand-base border border-white/10 p-3 text-brand-cream mt-1 focus:outline-none focus:border-brand-sand">
                </div>
                <button type="submit" class="w-full py-3 bg-brand-cream text-brand-base font-semibold text-xs tracking-widest uppercase hover:bg-brand-sand">Submit Inquiry</button>
            </form>
        </div>
    </section>
